# Runs the marketing/app build checks, the app's end-to-end tests and the database foundation
# checks on every push and pull request.
# Uses only GitHub-hosted runners (free for public repositories) and the local Supabase
# stack started by the Supabase CLI inside the runner. No secrets, no deployment.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Marketing site lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Placeholder public values: the build only needs them to exist (src/lib/env.ts).
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_value

      - name: Scan browser bundle for secrets
        run: npm run test:bundle

  app:
    name: App end-to-end (auth, onboarding, customers, isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Local stack only, including Mailpit for auth emails. No hosted project, no secrets.
      - name: Start local Supabase stack
        run: npx supabase start

      - name: Write .env.local from the local stack
        run: npm run env:local

      - name: Unit tests
        run: npm run test:unit

      - name: Build and start the production server
        run: |
          npm run build
          npm run test:bundle
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/sign-in && exit 0; sleep 1; done
          echo "Server did not start" && exit 1

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  database:
    name: Migrations, pgTAP security tests, Node concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Lint database functions
        run: npx supabase db lint --level warning --fail-on error

      # Resets to an empty database, applies every migration, then runs pgTAP and Node tests.
      - name: Test
        run: npm test

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
